name: APK Build

on:
  push:
    branches:
      - ci/apk-build
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NORMAL_APK_PATH: /tmp/acode-debug.apk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm

      - name: Compute metadata
        id: meta
        run: |
          GIT_COMMIT="$(git rev-parse HEAD)"
          echo "git_commit=$GIT_COMMIT" >> "$GITHUB_OUTPUT"
          echo "artifact_name=acode-debug-$GIT_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Install deps
        run: |
          npm install
          npm install -g cordova
          npm run setup

      - name: Build debug APK
        run: |
          node utils/storage_manager.mjs y
          npm run build paid dev apk
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ${{ env.NORMAL_APK_PATH }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ env.NORMAL_APK_PATH }}

      - name: Build summary
        run: |
          echo "## APK Build" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | ----- |" >> $GITHUB_STEP_SUMMARY
          echo "| Git Commit | ${{ steps.meta.outputs.git_commit }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | ${{ steps.meta.outputs.artifact_name }} |" >> $GITHUB_STEP_SUMMARY